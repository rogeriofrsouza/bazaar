name: bazaar

services:
  config-server:
    container_name: config-server
    image: rogeriofrsouza/bazaar-config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_SEARCH_LOCATIONS: ${CONFIG_SERVER_SEARCH_LOCATIONS}
    volumes:
      - ../config-repo:/config-repo:ro

  discovery-server:
    container_name: discovery-server
    image: rogeriofrsouza/bazaar-discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    container_name: api-gateway
    image: rogeriofrsouza/bazaar-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL}
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started

  catalog-service:
    container_name: catalog-service
    image: rogeriofrsouza/bazaar-catalog-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      DB_URL: ${CATALOG_DB_URL}
      DB_USERNAME: ${CATALOG_DB_USERNAME}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL}
      JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
    depends_on:
      catalog-service-db:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started

  inventory-service:
    container_name: inventory-service
    image: rogeriofrsouza/bazaar-inventory-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      DB_URL: ${INVENTORY_DB_URL}
      DB_USERNAME: ${INVENTORY_DB_USERNAME}
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL}
      JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
    depends_on:
      inventory-service-db:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started

  order-service:
    container_name: order-service
    image: rogeriofrsouza/bazaar-order-service
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      DB_URL: ${ORDER_DB_URL}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL}
      JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
    depends_on:
      order-service-db:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started

  customer-service:
    container_name: customer-service
    image: rogeriofrsouza/bazaar-customer-service
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      DB_URL: ${CUSTOMER_DB_URL}
      DB_USERNAME: ${CUSTOMER_DB_USERNAME}
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL}
      JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
    depends_on:
      customer-service-db:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
