name: bazaar

services:
  config-server:
    container_name: config-server
    image: rogeriofrsouza/bazaar-config-server
    ports:
      - "8888:8888"
    environment:
      CONFIG_SEARCH_LOCATIONS: ${CONFIG_SERVER_SEARCH_LOCATIONS}
    volumes:
      - ../config-repo:/config-repo:ro

  discovery-server:
    container_name: discovery-server
    image: rogeriofrsouza/bazaar-discovery-server
    ports:
      - "8761:8761"

  api-gateway:
    container_name: api-gateway
    image: rogeriofrsouza/bazaar-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL}
    depends_on:
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
