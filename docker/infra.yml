name: bazaar

services:
  catalog-service-db:
    container_name: catalog-service-db
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    volumes:
      - catalog-service-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U catalog -d catalog" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  catalog-service-db-data:
