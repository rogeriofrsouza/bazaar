server:
  port: 8083

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s

bazaar:
  orders:
    reservation-ttl: 1h
    expiry-check-delay: 5m
