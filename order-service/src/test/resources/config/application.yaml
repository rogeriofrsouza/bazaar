server:
  port: 8083

spring:
  cloud:
    config:
      enabled: false
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/bazaar
          jwk-set-uri: http://localhost:9090/realms/bazaar/protocol/openid-connect/certs
  kafka:
    producer:
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

eureka:
  client:
    enabled: false

bazaar:
  gateway-url: http://localhost:8080
  outbox:
    relay-delay: 1h
